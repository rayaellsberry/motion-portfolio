<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Motion Graphics Designer specializing in sports entertainment, live event visuals, and immersive 3D content.">
  <meta property="og:title" content="Raya Ellsberry | Project Details">
  <meta property="og:description" content="Motion Graphics Designer specializing in sports entertainment, live event visuals, and immersive 3D content.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourdomain.com/">
  <meta property="og:image" content="assets/high-resolution-color-logo.png">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome 6 for Brand Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="project-details-page">

  <!-- Global Glowing Background Gradients -->
  <div class="bg-glow-wrapper">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
  </div>

  <!-- Header Navigation -->
  <header>
    <a href="index.html" class="logo" id="header-logo">
      <img src="assets/high-resolution-color-logo.png" alt="Raya Ellsberry Logo" class="logo-img">
    </a>
    
    <!-- Hamburger button -->
    <button class="menu-trigger-btn" id="menu-btn" aria-label="Toggle Navigation Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Left Sidebar Layout -->
  <div class="left-sidebar">
    <div class="sidebar-line"></div>
    <div class="sidebar-socials">
  <a href="https://www.linkedin.com/in/raya-ellsberry/" target="_blank" aria-label="LinkedIn Profile"><i class="fa-brands fa-linkedin-in"></i></a>
</div>
    <div class="sidebar-line bottom-line"></div>
    <div class="sidebar-indicator" id="sidebar-active-indicator">Projects</div>
  </div>

  <!-- Fullscreen Split Navigation Menu Overlay -->
  <div class="menu-overlay" id="menu-panel">
    <!-- Background glowing hexagon on right side -->
    <div class="menu-bg-hexagon">
      <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="250,40 431,145 431,355 250,460 69,355 69,145" stroke="rgba(197, 108, 240, 0.15)" stroke-width="2" fill="rgba(197, 108, 240, 0.02)" />
        <!-- Glowing TP Monogram -->
        <image href="assets/high-resolution-color-logo.png" x="150" y="150" height="200" width="200" opacity="0.15" />
      </svg>
    </div>

    <!-- Left navigation list (pointing to main page sections) -->
    <div class="menu-left-pane">
      <ul class="nav-links">
        <li><a href="index.html#homepage" id="nav-home">Homepage</a></li>
        <li><a href="index.html#portfolio" id="nav-portfolio">Portfolio</a></li>
        <li><a href="index.html#about" id="nav-about">About</a></li>
        <li><a href="index.html#end" id="nav-contact">Contact</a></li>
      </ul>
      <div class="menu-label-corner">Menu</div>
    </div>

    <!-- Right contact panel -->
    <div class="menu-right-pane">
      <div class="contact-section-wrapper">
        <h2 class="contact-label">Contact</h2>
        <ul class="contact-info-list">
          <li><a href="mailto:rayaellsberry@gmail.com" id="contact-email">rayaellsberry@gmail.com</a></li>
          <li><span id="contact-location">Based in Detroit</span></li>
        </ul>
        
        <a href="assets/Raya%20E%202026%20Motion%20GFX%20Resume.pdf" class="resume-download-btn" id="resume-btn" download>Resume Download</a>
        
        <div class="menu-social-icons">
          <a href="https://www.linkedin.com/in/raya-ellsberry/" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="https://www.artstation.com/rayaellsberry1" target="_blank" aria-label="ArtStation"><i class="fa-brands fa-artstation"></i></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Non-Scrollable Centered Details Section -->
  <main class="project-page-content">
    <!-- Translucent background Hexagon centered -->
    <div class="details-bg-hexagon">
      <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="250,40 431,145 431,355 250,460 69,355 69,145" stroke="rgba(197, 108, 240, 0.12)" stroke-width="2" fill="rgba(197, 108, 240, 0.01)" />
        <image href="assets/high-resolution-color-logo.png" x="150" y="150" height="200" width="200" opacity="0.08" />
      </svg>
    </div>

    <!-- Active layout structure styled directly from index.css rules -->
    <div class="project-details-layout" style="opacity: 1; transform: translateY(0);">
      <!-- Top Title and Back Link -->
      <div class="details-header-wrapper">
        <a href="index.html#portfolio" class="back-link" id="project-back-btn">
          <i class="fa-solid fa-arrow-left-long"></i> Back to Portfolio
        </a>
        <h2 class="details-project-title" id="details-project-name">Project Title</h2>
        <div class="details-project-meta">
          <span class="details-project-category" id="details-project-category">Category</span>
          <span class="details-project-date" id="details-project-date">Date</span>
        </div>
      </div>

      <!-- Main Display Box (Images Here) -->
      <div class="details-image-box">
        <img src="" class="details-display-img" id="details-gallery-img" alt="Selected Project Visual">
        <button class="play-pause-btn" id="play-pause-btn" style="display:none;"><i class="fa-solid fa-play"></i></button>
        
        <!-- Gallery Navigation Buttons inside the box (bottom right) -->
        <div class="gallery-nav-widget">
          <button class="gallery-arrow-btn prev" id="gallery-prev" aria-label="Previous Gallery Image">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button class="gallery-arrow-btn next" id="gallery-next" aria-label="Next Gallery Image">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Description Box -->
      <div class="details-description-box">
        <h3 class="details-desc-title">Short Project Description</h3>
        <p class="details-desc-body" id="details-project-desc">
          Project details description will load here dynamically.
        </p>
      </div>

      <!-- Next Project Button -->
      <div class="next-project-footer">
        <button class="next-project-pill-btn" id="next-project-btn">
          <div class="arrow-circle-next"><i class="fa-solid fa-arrow-left"></i></div>
          <span class="next-project-label">Next Project</span>
          <div class="arrow-circle-next"><i class="fa-solid fa-arrow-right"></i></div>
        </button>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared projects database -->
  <script src="projects-data.js"></script>
  <!-- Custom Details Page Logic -->
  <script src="project.js"></script>

</body>
</html>
